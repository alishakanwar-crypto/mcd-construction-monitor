services:
  # Backend API
  - type: web
    name: mcd-monitor-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
    disk:
      name: mcd-data
      mountPath: /data
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: mcd-monitor-frontend
    runtime: static
    buildCommand: cd frontend && npm install && VITE_API_URL=https://mcd-monitor-backend.onrender.com npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
